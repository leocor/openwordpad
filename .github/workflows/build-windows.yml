name: Build Windows x64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: ninja-build/setup-ninja@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtsvg'

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project & Tests
        run: |
          cmake --build build --config Release

      - name: Run Test Suite
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Prepare Windows Distribution Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\openwordpad.exe dist\
          windeployqt --release --compiler-runtime --no-translations dist\openwordpad.exe
          Compress-Archive -Path dist\* -DestinationPath OpenWordPad-Windows-x64.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWordPad-Windows-x64
          path: OpenWordPad-Windows-x64.zip
          retention-days: 30
