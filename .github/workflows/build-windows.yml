name: Build Windows x64

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64 Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 6 via aqtinstall
        shell: pwsh
        run: |
          pip install aqtinstall
          $arch = (python -m aqt list-qt windows desktop --arch 6.7.2 | Select-Object -First 1).Trim()
          Write-Host "Detected Qt Architecture: $arch"
          python -m aqt install-qt windows desktop 6.7.2 $arch -O C:\Qt -m qtsvg
          $qtPath = "C:\Qt\6.7.2\$arch"
          echo "QT_ROOT=$qtPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$qtPath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:QT_ROOT"

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Run Test Suite
        shell: pwsh
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Prepare Windows Distribution Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\Release\openwordpad.exe dist\
          & "$env:QT_ROOT\bin\windeployqt.exe" --release --compiler-runtime --no-translations dist\openwordpad.exe
          Compress-Archive -Path dist\* -DestinationPath OpenWordPad-Windows-x64.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWordPad-Windows-x64
          path: OpenWordPad-Windows-x64.zip
          retention-days: 30
