name: Release Multiplatform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.1.6)'
        required: true
        default: 'v1.1.6'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 6
        shell: pwsh
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 -m qtimageformats -O C:\Qt
          echo "QT_ROOT=C:/Qt/6.7.2/msvc2019_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Qt\6.7.2\msvc2019_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/6.7.2/msvc2019_64"

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Run Test Suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "C:\Qt\6.7.2\msvc2019_64\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "C:\Qt\6.7.2\msvc2019_64\plugins"
          ctest --test-dir build --output-on-failure -C Release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\openwordpad.exe dist\
          & "C:\Qt\6.7.2\msvc2019_64\bin\windeployqt.exe" --release --compiler-runtime --no-translations dist\openwordpad.exe
          Compress-Archive -Path dist\* -DestinationPath OpenWordPad-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWordPad-Windows-x64
          path: OpenWordPad-Windows-x64.zip

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential \
            qt6-base-dev qt6-base-dev-tools libqt6svg6-dev qt6-image-formats-plugins libgl1-mesa-dev libfuse2 file wget

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Run Test Suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Package Linux Standalone AppImage & Bundle
        run: |
          # 1. Create AppDir structure
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/plugins AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/openwordpad AppDir/usr/bin/
          cp openwordpad.desktop AppDir/
          cp resources/icons/app_icon.svg AppDir/usr/share/icons/hicolor/scalable/apps/openwordpad.svg
          cp resources/icons/app_icon.png AppDir/openwordpad.png

          # 2. Copy Qt6 and runtime dependencies into AppDir
          find /usr/lib -name "libQt6*.so*" 2>/dev/null | xargs -I {} cp -a {} AppDir/usr/lib/ 2>/dev/null || true
          find /usr/lib -name "libicu*.so*" 2>/dev/null | xargs -I {} cp -a {} AppDir/usr/lib/ 2>/dev/null || true
          find /usr/lib -name "libxkbcommon*.so*" 2>/dev/null | xargs -I {} cp -a {} AppDir/usr/lib/ 2>/dev/null || true

          # 3. Copy Qt6 plugins
          cp -r /usr/lib/x86_64-linux-gnu/qt6/plugins/* AppDir/usr/plugins/ 2>/dev/null || true

          # 4. Create AppRun script
          cat << 'EOF' > AppDir/AppRun
#!/bin/bash
HERE="$(dirname "$(readlink -f "${0}")")"
export PATH="${HERE}/usr/bin:${PATH}"
export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
export QT_PLUGIN_PATH="${HERE}/usr/plugins"
export QML2_IMPORT_PATH="${HERE}/usr/qml"
exec "${HERE}/usr/bin/openwordpad" "$@"
EOF
          chmod +x AppDir/AppRun

          # 5. Download appimagetool and generate standalone AppImage
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run AppDir OpenWordPad-Linux-x86_64.AppImage
          chmod +x OpenWordPad-Linux-x86_64.AppImage

          # 6. Create tar.gz bundle containing the AppImage and metadata
          tar -czvf OpenWordPad-Linux-x86_64.tar.gz OpenWordPad-Linux-x86_64.AppImage openwordpad.desktop README.md LICENSE

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWordPad-Linux-x86_64
          path: |
            OpenWordPad-Linux-x86_64.AppImage
            OpenWordPad-Linux-x86_64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenWordPad-Windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenWordPad-Linux-x86_64

      - name: Determine Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: OpenWordPad ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            OpenWordPad-Windows-x64.zip
            OpenWordPad-Linux-x86_64.AppImage
            OpenWordPad-Linux-x86_64.tar.gz
