name: Release Multiplatform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v1.1.6)'
        required: true
        default: 'v1.1.6'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Qt 6
        shell: pwsh
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop 6.7.2 win64_msvc2019_64 -m qtimageformats -O C:\Qt
          echo "QT_ROOT=C:/Qt/6.7.2/msvc2019_64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "C:\Qt\6.7.2\msvc2019_64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="C:/Qt/6.7.2/msvc2019_64"

      - name: Build Project
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Run Test Suite
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:PATH = "C:\Qt\6.7.2\msvc2019_64\bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "C:\Qt\6.7.2\msvc2019_64\plugins"
          ctest --test-dir build --output-on-failure -C Release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item build\openwordpad.exe dist\
          & "C:\Qt\6.7.2\msvc2019_64\bin\windeployqt.exe" --release --compiler-runtime --no-translations dist\openwordpad.exe
          Compress-Archive -Path dist\* -DestinationPath OpenWordPad-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWordPad-Windows-x64
          path: OpenWordPad-Windows-x64.zip

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential \
            qt6-base-dev libqt6svg6-dev qt6-image-formats-plugins libgl1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Run Test Suite
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Package Linux Binary Bundle
        run: |
          mkdir -p dist/OpenWordPad
          cp build/openwordpad dist/OpenWordPad/
          cp openwordpad.desktop dist/OpenWordPad/
          cp run.sh dist/OpenWordPad/
          chmod +x dist/OpenWordPad/openwordpad dist/OpenWordPad/run.sh
          tar -czvf OpenWordPad-Linux-x86_64.tar.gz -C dist OpenWordPad

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWordPad-Linux-x86_64
          path: OpenWordPad-Linux-x86_64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenWordPad-Windows-x64

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: OpenWordPad-Linux-x86_64

      - name: Determine Tag
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: OpenWordPad ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            OpenWordPad-Windows-x64.zip
            OpenWordPad-Linux-x86_64.tar.gz
